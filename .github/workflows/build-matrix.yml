name: Synthetic Brain Build Matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rust_target: x86_64-pc-windows-msvc
          - os: macos-latest
            name: macos-arm64
            rust_target: aarch64-apple-darwin
          - os: ubuntu-latest
            name: linux-x64
            rust_target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-client/package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build researcher browser
        working-directory: web-client
        run: |
          npm install
          npm run build

      - name: Build Rust core
        working-directory: rust
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Build Rust server
        working-directory: rust/server
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Validate Python API imports
        working-directory: server/python
        run: python -m compileall app
