# Synthetic Human Brain — dedicated MySQL server options (my.ini / my.cnf)
# Place at: C:\ProgramData\MySQL\MySQL Server 8.0\my.ini (Windows)
#       or: /etc/mysql/mysql.conf.d/synthetic-brain.cnf (Linux)
# Tuned for a research platform with JSON telemetry workloads.

[mysqld]
# --- identity -------------------------------------------------------------
server-id                 = 1

# --- networking ------------------------------------------------------------
bind-address              = 127.0.0.1
port                      = 3306
max_connections           = 200

# --- files / storage --------------------------------------------------------
datadir                   = /var/lib/mysql        # Windows: C:/ProgramData/MySQL/MySQL Server 8.0/Data
default-storage-engine    = InnoDB
innodb_buffer_pool_size   = 1G
innodb_log_file_size      = 256M
innodb_flush_method       = O_DIRECT              # omit on Windows

# --- character set (matches schema.sql) -------------------------------------
character-set-server      = utf8mb4
collation-server          = utf8mb4_unicode_ci

# --- JSON / query tuning -----------------------------------------------------
json_merge_preserve_max_depth = 50
max_allowed_packet        = 64M
tmp_table_size            = 64M
max_heap_table_size       = 64M
sort_buffer_size          = 2M

# --- logging -----------------------------------------------------------------
log_error                 = /var/log/mysql/error.log
slow_query_log            = ON
slow_query_log_file       = /var/log/mysql/slow.log
long_query_time           = 1.0

[client]
port                      = 3306
default-character-set     = utf8mb4

[mysql]
default-character-set     = utf8mb4
