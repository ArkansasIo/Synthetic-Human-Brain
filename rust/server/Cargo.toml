[package]
name = "synthetic-brain-server"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Rust worker/API service for Synthetic Human Brain"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
